name: Release & Docker

on:
  workflow_dispatch:  # Build selected ref by full SHA; no release or deployment.
  push:
    tags:
      - 'v*'
      - 'exp-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required: create GitHub Release
      packages: write   # required: push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Check whether this is a stable or experimental release
      - name: Detect release channel
        id: channel
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      # Create GitHub Release from tag with auto-generated notes
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.is_stable == 'false' }}

      # Set up multi-arch build (QEMU + Buildx)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract tags from the git ref (supports vX.Y and vX.Y.Z formats)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(\d+\.\d+(?:\.\d+)?),group=1,enable=${{ github.event_name == 'push' }}
            type=match,pattern=exp-v(\d+\.\d+(?:\.\d+)?),group=1,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && steps.channel.outputs.is_stable == 'true' }}
            type=raw,value=experimental,enable=${{ github.event_name == 'push' && steps.channel.outputs.is_stable == 'false' }}
            type=sha,format=long,prefix=sha-

      # Build and push multi-arch image (amd64 + arm64)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_VERSION=${{ github.event_name == 'push' && github.ref_name || format('sha-{0}', github.sha) }}
            HERMES_SOURCE=https://github.com/${{ github.repository }}
            HERMES_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference (not deployment)
        env:
          IMAGE_NAMES: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          first_tag="${IMAGE_NAMES%%$'\n'*}"
          image="${first_tag%:*}"
          printf 'Source revision: `%s`\n\nImmutable image: `%s@%s`\n' \
            "$SOURCE_REVISION" "$image" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
